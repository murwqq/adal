{% load i18n %}{% get_current_language as LANG %}
<form class="lang-switch" action="{% url 'set_language' %}" method="post" aria-label="{% translate 'Язык интерфейса' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="kk" lang="kk" {% if LANG == "kk" %}aria-pressed="true"{% endif %}>Қаз</button>
  <button type="submit" name="language" value="ru" lang="ru" {% if LANG == "ru" %}aria-pressed="true"{% endif %}>Рус</button>
  <button type="submit" name="language" value="en" lang="en" {% if LANG == "en" %}aria-pressed="true"{% endif %}>Eng</button>
</form>
